services:
  db:
    # Pinned to the major version the data volume was created with.
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DATABASE_NAME}
    ports:
      - "${PORT_DATABASE}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    # Lets `docker compose up --wait` (npm run services:up) return only once Postgres accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
  # Web search for the agent (web_search tool). JSON API on http://localhost:8080/search?q=…&format=json
  searxng:
    # Pinned: SearXNG publishes date-stamped builds.
    image: searxng/searxng:2026.10.11-ad46ebd7d
    restart: always
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:${SEARXNG_PORT:-8080}/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
  # Optional: run the API in a container instead of `npm run dev` on your machine.
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: huddle-api
    image: huddle-api:dev
    env_file:
      - .env
    ports:
      - ${PORT}:${PORT}
    environment:
      - DATABASE_URL=postgresql://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DATABASE_NAME}?schema=public
    depends_on:
      - db
    volumes:
      - ./src:/app/apps/api/src
      - ./prisma:/app/apps/api/prisma
volumes:
  db:
    driver: local
